<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101d32" />
    <title>Quran for Everyone | Prayer Times &amp; Reminders</title>
    <style>
      body{margin:0;background:#f6f5f1;color:#1a2a40;font-family:Arial,sans-serif}
      #startup-message{max-width:680px;margin:12vh auto;padding:28px;background:#fff;border:1px solid #e5e3dd;border-radius:18px;line-height:1.6}
      #startup-message code{background:#f1f2f4;padding:3px 6px;border-radius:5px}

  <body>
    <div id="root">
      <main id="startup-message">
        <h1>Quran for Everyone is starting…</h1>
        <p>If this message does not disappear, make sure you started the app using Vite rather than opening this HTML file directly.</p>
        <p>In the project folder, run <code>npm install</code> and then <code>npm run dev</code>. Open the local address printed in the terminal.</p>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
